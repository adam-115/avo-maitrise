<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="onClose()"></div>
  
  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all animate-in fade-in zoom-in duration-300">
    <!-- Header -->
    <div class="px-8 py-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
      <div>
        <h3 class="text-xl font-black text-slate-900 flex items-center gap-3">
          <span class="p-2 bg-indigo-100 text-indigo-600 rounded-xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </span>
          Assigner un formulaire
        </h3>
        <p class="text-slate-500 text-sm mt-1 font-medium">Choisissez le formulaire à remplir par le client.</p>
      </div>
      <button (click)="onClose()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-400 hover:text-slate-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="p-8">
      <label class="block text-sm font-bold text-slate-700 mb-3">Sélectionnez un formulaire</label>
      <div class="space-y-3 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
        @for (form of availableForms; track form.id) {
          <div 
            (click)="selectForm(form.id!)"
            class="group relative p-4 rounded-2xl border-2 transition-all cursor-pointer"
            [ngClass]="{
              'border-indigo-500 bg-indigo-50/50 ring-4 ring-indigo-500/10': selectedFormId === form.id,
              'border-slate-100 bg-slate-50 hover:border-slate-200 hover:bg-white': selectedFormId !== form.id
            }">
            <div class="flex items-center justify-between">
              <div>
                <h4 class="font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">{{ form.title }}</h4>
                <p class="text-xs text-slate-500 mt-0.5 line-clamp-1">{{ form.description }}</p>
              </div>
              @if (selectedFormId === form.id) {
                <span class="bg-indigo-500 text-white p-1 rounded-full shadow-lg shadow-indigo-500/30">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                  </svg>
                </span>
              }
            </div>
          </div>
        } @empty {
          <div class="py-8 text-center bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
            <p class="text-slate-500 font-medium">Aucun formulaire disponible pour ce type de client.</p>
          </div>
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="px-8 py-6 bg-slate-50/80 border-t border-slate-100 flex gap-3">
      <button 
        (click)="onClose()"
        class="flex-1 px-6 py-3 rounded-xl bg-white border-2 border-slate-200 text-slate-600 font-bold hover:bg-slate-100 transition-all text-sm uppercase tracking-wider">
        Annuler
      </button>
      <button 
        (click)="onAssign()"
        [disabled]="!selectedFormId"
        class="flex-1 px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-xl shadow-indigo-200 text-sm uppercase tracking-wider">
        Assigner
      </button>
    </div>
  </div>
</div>
