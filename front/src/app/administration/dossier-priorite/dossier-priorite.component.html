<div class="art-page-bg p-4 sm:p-8 animate-fadeIn space-y-6">
    <h2 class="text-2xl art-heading mb-6">Gestion des Priorités de Dossier</h2>

    <!-- Formulaire d'ajout/édition -->
    <div class="art-card p-8 mb-6">
        <h3 class="text-xl font-semibold mb-2">{{ isEditing ? 'Modifier' : 'Ajouter' }} une Priorité</h3>

        <form [formGroup]="priorityForm" (ngSubmit)="onSubmit()">
            <div class="mb-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="label">Libellé</label>
                    <input id="label" type="text" formControlName="label"
                        class="art-input"
                        placeholder="Ex: Normale" />
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="code">Code</label>
                    <input id="code" type="text" formControlName="code"
                        class="art-input"
                        placeholder="Ex: NORMALE" />
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="color">Couleur</label>
                    <input id="color" type="color" formControlName="color"
                        class="h-10 w-full rounded cursor-pointer border-2 border-slate-300 hover:border-slate-400 transition-colors" />
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="order">Ordre d'affichage</label>
                    <input id="order" type="number" formControlName="order"
                        class="art-input" />
                </div>

                <div class="flex items-center mt-6">
                    <input id="active" type="checkbox" formControlName="active"
                        class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500" />
                    <label for="active" class="ml-2 block text-sm text-gray-900">Actif</label>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <button
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                    type="submit" [disabled]="priorityForm.invalid">
                    {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
                </button>
                <button *ngIf="isEditing" type="button" (click)="cancelEdit()"
                    class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Annuler
                </button>
            </div>
        </form>
    </div>

    <!-- Liste des priorités -->
    <div class="art-card px-8 pt-6 pb-8">
        <h3 class="text-xl font-semibold mb-4">Liste des Priorités</h3>
        <div class="overflow-x-auto">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Ordre</th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Couleur</th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Libellé</th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Code</th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Statut</th>
                        <th
                            class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let priority of priorities">
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">{{ priority.order }}</td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <div [style.background-color]="priority.color"
                                class="w-6 h-6 rounded-full border border-gray-300"></div>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm font-medium">{{ priority.label }}
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">{{ priority.code }}</td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                [ngClass]="priority.active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                                {{ priority.active ? 'Actif' : 'Inactif' }}
                            </span>
                        </td>
                        <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                            <button (click)="editPriority(priority)"
                                class="text-blue-600 hover:text-blue-900 mr-4">Éditer</button>
                            <button (click)="deletePriority(priority.id)"
                                class="text-red-600 hover:text-red-900">Désactiver</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
