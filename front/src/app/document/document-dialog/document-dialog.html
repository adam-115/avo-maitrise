<form [formGroup]="documentDialogFrom">
  <div id="upload-document-modal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 my-8 transform transition-all border border-slate-200">

      <div class="px-6 py-5 flex justify-between items-center bg-emerald-600 rounded-t-2xl shadow-sm">
        <h3 class="text-lg font-black text-white flex items-center gap-3">
          <div class="p-2 bg-emerald-500 rounded-xl text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          </div>
          {{dialogTitle}}
        </h3>
        <button type="button" (click)="closeModal()" class="p-2 rounded-xl text-emerald-100 hover:text-white hover:bg-emerald-500 transition-all cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-6 space-y-6 bg-white">
        
        <!-- Bloc Titre -->
        <div class="space-y-2">
          <label class="block text-sm font-black text-slate-800 ml-1">Titre du Document <span class="text-rose-500">*</span></label>
          <input type="text" formControlName="title"
            [ngClass]="{
              'border-rose-500 bg-rose-50 ring-2 ring-rose-500/20': documentDialogFrom.get('title')?.invalid && documentDialogFrom.get('title')?.touched,
              'border-slate-200 bg-slate-50 hover:bg-white hover:border-slate-300': !documentDialogFrom.get('title')?.invalid || !documentDialogFrom.get('title')?.touched
            }"
            class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border transition-all text-sm font-bold text-slate-800 placeholder-slate-400">
        </div>

        <!-- Bloc Fichier -->
        <div class="space-y-2">
          <label class="block text-sm font-black text-slate-800 ml-1">Fichier <span class="text-rose-500" *ngIf="!selectedDocument">*</span></label>
          <div
            [ngClass]="{
              'border-rose-400 bg-rose-50': !selectedFile && !selectedDocument && documentDialogFrom.get('title')?.touched,
              'border-slate-200 hover:border-emerald-400 bg-slate-50 hover:bg-emerald-50/30': !selectedFile && !selectedDocument && !documentDialogFrom.get('title')?.touched,
              'border-emerald-400 bg-emerald-50/50': selectedFile || selectedDocument
            }"
            class="flex justify-center px-6 pt-8 pb-8 border-2 border-dashed rounded-xl transition duration-300 relative cursor-pointer">
            <div class="space-y-2 text-center">
              <div class="mx-auto h-14 w-14 rounded-full flex items-center justify-center mb-3 transition-colors"
                [ngClass]="(selectedFile || selectedDocument) ? 'bg-emerald-100 text-emerald-600' : 'bg-white shadow-sm border border-slate-100 text-slate-400'">
                  <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v8"></path>
                  </svg>
              </div>
              <div class="flex text-sm text-slate-600 justify-center items-center gap-1">
                <label for="file-upload" class="relative cursor-pointer bg-transparent rounded-md font-black text-emerald-600 hover:text-emerald-700 outline-none transition-colors">
                  <span>{{ (selectedFile || selectedDocument) ? 'Changer le fichier' : 'Uploader un fichier' }}</span>
                  <input id="file-upload" type="file" (change)="onFileSelected($event)" class="sr-only">
                </label>
                <p class="font-bold text-slate-400">ou glisser-déposer</p>
              </div>
              <p class="text-[10px] uppercase tracking-wider" [ngClass]="(selectedFile || selectedDocument) ? 'text-emerald-700 font-black' : 'text-slate-400 font-bold'">
                {{ selectedFile ? selectedFile.name : (selectedDocument ? (selectedDocument.nomFichier || selectedDocument.filename || selectedDocument.name || 'Fichier existant') : 'PDF, DOCX, JPG, XLSX (Max 10MB)') }}
              </p>
            </div>
          </div>
        </div>

        <!-- Bloc Notes -->
        <div class="space-y-2">
          <label class="block text-sm font-black text-slate-800 ml-1">Notes (Facultatif)</label>
          <textarea formControlName="description" rows="3" class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-200 bg-slate-50 hover:bg-white hover:border-slate-300 transition-all text-sm font-bold text-slate-800 placeholder-slate-400"></textarea>
        </div>
      </div>

      <div class="px-6 py-5 flex justify-end space-x-3 rounded-b-2xl">
        <button type="button" (click)="closeModal()" class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 hover:text-slate-900 transition-colors cursor-pointer border-0">Annuler</button>

        <button type="submit" (click)="submit()"
          [disabled]="documentDialogFrom.invalid || (!selectedFile && !selectedDocument)"
          [ngClass]="{
            'bg-slate-900 hover:bg-slate-800 shadow-md text-white cursor-pointer': documentDialogFrom.valid && (selectedFile || selectedDocument),
            'bg-slate-100 text-slate-400 cursor-not-allowed border-0': documentDialogFrom.invalid || (!selectedFile && !selectedDocument)
          }"
          class="px-6 py-2.5 rounded-xl text-sm font-black transition-all">
          {{ selectedDocument ? 'Enregistrer' : 'Uploader' }}
        </button>
      </div>

    </div>
  </div>
</form>
