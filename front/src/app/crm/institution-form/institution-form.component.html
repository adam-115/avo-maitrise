<div class="art-page-bg p-4 sm:p-8 animate-fadeIn">
    <div class="max-w-4xl mx-auto">

        <div class="mb-10">
            <h1 class="text-4xl font-black tracking-tighter text-slate-900">
                {{ isEditMode ? 'Modification' : 'Nouvelle' }} <span class="text-amber-500">Institution</span>
            </h1>
            <p class="text-slate-500 font-medium mt-2">Identification d'Organisme Institutionnel</p>
        </div>

        <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="space-y-8">

            <!-- Informations Institution -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-black uppercase tracking-tight text-slate-900 mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    Détails Institution
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-2">
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Désignation de l'Institution <span class="text-red-500">*</span></label>
                        <input type="text" formControlName="nom" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">N° Registre National (RN) <span class="text-red-500">*</span></label>
                        <input type="text" formControlName="numeroRegistreNational" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Identifiant Fiscal</label>
                        <input type="text" formControlName="numeroIdFiscal" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Représentant Légal -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-black uppercase tracking-tight text-slate-900 mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    Représentant Légal
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Nom</label>
                        <input type="text" formControlName="nomRepresentantLegal" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Prénom</label>
                        <input type="text" formControlName="prenomRepresentantLegal" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Contact -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-black uppercase tracking-tight text-slate-900 mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-500"></span>
                    Contact & Siège
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Email <span class="text-red-500">*</span></label>
                        <input type="email" formControlName="email" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Téléphone <span class="text-red-500">*</span></label>
                        <input type="tel" formControlName="telephone" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Pays <span class="text-red-500">*</span></label>
                        <input type="text" formControlName="pays" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Secteur <span class="text-red-500">*</span></label>
                        <select formControlName="secteurActivite" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                            @for (sec of secteurs; track sec.code) {
                                <option [value]="sec.code">{{ sec.libelle }}</option>
                            }
                        </select>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-4">
                <button type="button" (click)="cancel()" class="px-8 py-4 text-sm font-black uppercase tracking-widest text-slate-500 hover:text-slate-900 transition-all">
                    Annuler
                </button>
                <button type="submit" class="px-10 py-4 bg-slate-900 text-white text-sm font-black uppercase tracking-widest rounded-2xl hover:bg-amber-600 shadow-lg shadow-slate-200 transition-all">
                    {{ isEditMode ? 'Enregistrer' : 'Créer l\'Institution' }}
                </button>
            </div>
        </form>
    </div>
</div>

<app-document-dialog *ngIf="showAddDocumentDialog" (addDocumentEvent)="onAddDocument($event)" (closeDialogEvent)="closeAddDocumentDialog()"></app-document-dialog>
