<div class="min-h-screen bg-slate-50 p-6 md:p-12 font-sans text-slate-900">
    <div class="max-w-4xl mx-auto">

        <div class="mb-10">
            <h1 class="text-4xl font-black tracking-tighter text-slate-900">
                {{ isEditMode ? 'Modification' : 'Nouvelle' }} <span class="text-blue-500">Personne Physique</span>
            </h1>
            <p class="text-slate-500 font-medium mt-2">Identification & Conformité Individuelle</p>
        </div>

        <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="space-y-8">

            <!-- Identité -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-black uppercase tracking-tight text-slate-900 mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    Détails Identité
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Nom <span class="text-red-500">*</span></label>
                        <input type="text" formControlName="nom" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Prénom <span class="text-red-500">*</span></label>
                        <input type="text" formControlName="prenom" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Nationalité</label>
                        <input type="text" formControlName="nationalite" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">CIN / Passeport</label>
                        <input type="text" formControlName="cin" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Date de Naissance</label>
                        <input type="date" formControlName="dateNaissance" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Contact -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-black uppercase tracking-tight text-slate-900 mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-500"></span>
                    Informations de Contact
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Email <span class="text-red-500">*</span></label>
                        <input type="email" formControlName="email" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Téléphone <span class="text-red-500">*</span></label>
                        <input type="tel" formControlName="telephone" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Adresse</label>
                        <input type="text" formControlName="adresse" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Pays <span class="text-red-500">*</span></label>
                        <input type="text" formControlName="pays" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-slate-400 mb-1">Secteur d'Activité <span class="text-red-500">*</span></label>
                        <select formControlName="secteurActivite" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm font-bold border-2 border-slate-300 focus:border-cyan-500 outline-none">
                            <option value="">Sélectionner</option>
                            @for (sec of secteurs; track sec.code) {
                                <option [value]="sec.code">{{ sec.libelle }}</option>
                            }
                        </select>
                    </div>
                </div>
            </div>

            <!-- Documents -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-black uppercase tracking-tight text-slate-900 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                        Documents KYC
                    </h2>
                    <button type="button" (click)="openAddDocumentDialog()" class="px-4 py-2 bg-slate-900 text-white text-[10px] font-black uppercase rounded-xl hover:bg-cyan-600 transition-colors">
                        Ajouter
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    @for (doc of documents; track doc.id) {
                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center border border-slate-200 shadow-sm">
                                <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                            </div>
                            <div>
                                <p class="text-xs font-black text-slate-800">{{ doc.nomFichier }}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase">{{ doc.typeDocument }}</p>
                            </div>
                        </div>
                        <button type="button" (click)="deleteDocument(doc.id)" class="text-slate-300 hover:text-red-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                    }
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-4">
                <button type="button" (click)="cancel()" class="px-8 py-4 text-sm font-black uppercase tracking-widest text-slate-500 hover:text-slate-900 transition-all">
                    Annuler
                </button>
                <button type="submit" class="px-10 py-4 bg-slate-900 text-white text-sm font-black uppercase tracking-widest rounded-2xl hover:bg-cyan-600 shadow-lg shadow-slate-200 transition-all">
                    {{ isEditMode ? 'Enregistrer' : 'Créer le Client' }}
                </button>
            </div>
        </form>
    </div>
</div>

<app-document-dialog *ngIf="showAddDocumentDialog" (addDocumentEvent)="onAddDocument($event)" (closeDialogEvent)="closeAddDocumentDialog()"></app-document-dialog>
