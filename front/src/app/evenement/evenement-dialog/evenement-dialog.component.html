<div id="event-creation-modal"
  class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 flex items-center justify-center backdrop-blur-sm p-4">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl mx-auto transform transition-all border border-slate-300 flex flex-col max-h-[95vh]"
    role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="px-6 py-5 flex justify-between items-center bg-emerald-600 rounded-t-2xl shadow-sm shrink-0">
      <h3 id="modal-title" class="text-lg font-bold text-white flex items-center gap-3">
        <div class="p-2 bg-emerald-500 rounded-xl text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        {{ eventToEdit ? 'Modifier l\'Événement' : 'Planifier un Nouvel Événement' }}
      </h3>
      <button type="button" (click)="onCloseModal()" class="p-2 rounded-xl text-emerald-100 hover:text-white hover:bg-emerald-500 transition-all cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="p-6 bg-slate-50 overflow-y-auto flex-grow">
      <form id="event-form" class="grid grid-cols-1 lg:grid-cols-2 gap-6" [formGroup]="eventForm" (ngSubmit)="submitForm()">

        <!-- Colonne Gauche : Informations Principales -->
        <div class="space-y-5">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Informations Générales
            </h4>
            
            <div class="space-y-1.5">
              <label for="event_title" class="block text-sm font-medium text-slate-700 ml-1">Objet de l'Événement <span class="text-rose-500">*</span></label>
              <input type="text" formControlName="titre" id="event_title" required
                placeholder="Ex: Audience, Réunion, Délai..."
                class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border transition-all text-sm text-slate-800 placeholder-slate-400"
                [ngClass]="eventForm.get('titre')?.invalid && eventForm.get('titre')?.touched ? 'border-rose-500 bg-rose-50 ring-2 ring-rose-500/20' : 'border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400'">
            </div>

            <div class="space-y-1.5">
              <label for="event_type" class="block text-sm font-medium text-slate-700 ml-1">Catégorie <span class="text-rose-500">*</span></label>
              <select id="event_type" formControlName="typeId" required
                class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border transition-all text-sm text-slate-800"
                [ngClass]="eventForm.get('typeId')?.invalid && eventForm.get('typeId')?.touched ? 'border-rose-500 bg-rose-50 ring-2 ring-rose-500/20' : 'border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400'">
                <option value="" disabled selected>Sélectionner une catégorie</option>
                <option *ngFor="let type of eventTypes" [value]="type.id">{{ type.label }}</option>
              </select>
            </div>

            <div class="space-y-1.5">
              <label for="event_location" class="block text-sm font-medium text-slate-700 ml-1">Lieu (Physique ou Visio)</label>
              <input type="text" formControlName="lieu" id="event_location"
                placeholder="Ex: Salle 3, Teams, Bureau..."
                class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400 transition-all text-sm text-slate-800 placeholder-slate-400">
            </div>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
             <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Intervenants <span class="text-rose-500">*</span>
            </h4>
            <div class="flex flex-wrap gap-2 mb-2">
              <div *ngFor="let user of getSelectedIntervenants()"
                class="inline-flex items-center bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg px-2.5 py-1.5 text-sm font-medium shadow-sm">
                {{ user.username }}
                <button type="button" (click)="removeIntervenant(user.id!)"
                  class="ml-2 text-emerald-500 hover:text-rose-600 focus:outline-none transition-colors cursor-pointer">
                  <span class="sr-only">Retirer</span>
                  <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                  </svg>
                </button>
              </div>
            </div>
            <button type="button" (click)="openUserDialog()"
              class="w-full flex items-center justify-between p-3 border border-slate-300 bg-slate-50 rounded-xl text-slate-600 hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-700 transition-colors focus:outline-none focus:ring-4 focus:ring-emerald-500/10 cursor-pointer shadow-sm">
              <span class="text-sm font-medium">Gérer les intervenants</span>
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
              </svg>
            </button>
            <input type="hidden" formControlName="participantsIds">
          </div>
        </div>

        <!-- Colonne Droite : Planification & Notes -->
        <div class="space-y-5">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
             <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Planification
            </h4>
            
            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label for="event_start_date" class="block text-sm font-medium text-slate-700 ml-1">Début <span class="text-rose-500">*</span></label>
                    <div class="flex items-center space-x-2">
                        <div class="relative flex-grow">
                        <input type="date" formControlName="startDate" id="event_start_date" required
                            class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400 transition-all text-sm text-slate-800">
                        </div>
                        <div class="relative w-32 shrink-0">
                        <input type="time" formControlName="startTime"
                            class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400 transition-all text-sm text-slate-800 text-center">
                        </div>
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label for="event_end_date" class="block text-sm font-medium text-slate-700 ml-1">Fin</label>
                    <div class="flex items-center space-x-2">
                        <div class="relative flex-grow">
                        <input type="date" formControlName="endDate" id="event_end_date"
                            class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400 transition-all text-sm text-slate-800">
                        </div>
                        <div class="relative w-32 shrink-0">
                        <input type="time" formControlName="endTime"
                            class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400 transition-all text-sm text-slate-800 text-center">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rappel -->
            <div class="flex items-center space-x-4 pt-4 mt-2 border-t border-slate-100">
              <div class="flex items-center">
                <input id="event_reminder" formControlName="reminder" type="checkbox"
                  class="h-4 w-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500 bg-white cursor-pointer">
                <label for="event_reminder" class="ml-2 block text-sm font-medium text-slate-700 cursor-pointer">
                  Activer un rappel
                </label>
              </div>
              
              <div *ngIf="eventForm.get('reminder')?.value" class="flex items-center space-x-2 animate-pulse bg-emerald-50 p-1.5 rounded-lg border border-emerald-100">
                <input type="number" formControlName="reminderMinutesBefore"
                  class="w-16 rounded-lg focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 p-1.5 border border-slate-300 bg-white text-sm text-center text-slate-800 outline-none">
                <span class="text-[11px] text-emerald-700 font-medium uppercase tracking-wider">min avant</span>
              </div>
            </div>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 flex-grow">
            <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                Description & Notes
            </h4>
            <textarea id="event_desc" formControlName="description" rows="4"
              class="block w-full rounded-xl focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 p-3 outline-none border border-slate-300 bg-slate-50 hover:bg-white hover:border-slate-400 transition-all text-sm text-slate-800 placeholder-slate-400"
              placeholder="Détails supplémentaires..."></textarea>
          </div>
        </div>

      </form>
    </div>

    <div class="px-6 py-5 bg-white border-t border-slate-200 flex justify-end space-x-3 rounded-b-2xl shrink-0">
      <button type="button" (click)="onCloseModal()"
        class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 hover:text-slate-900 transition-colors cursor-pointer border border-transparent">
        Annuler
      </button>
      <button type="submit" form="event-form" [disabled]="!eventForm.valid || getSelectedIntervenants().length === 0"
        class="px-6 py-2.5 rounded-xl text-sm font-medium transition-all cursor-pointer"
        [ngClass]="(eventForm.valid && getSelectedIntervenants().length > 0) ? 'bg-slate-900 text-white shadow-md hover:bg-slate-800' : 'bg-slate-200 text-slate-400 cursor-not-allowed'">
        Enregistrer
      </button>
    </div>

  </div>

  <app-user-selection-dialog *ngIf="showUserDialog" [users]="users"
    [initialSelection]="eventForm.get('participantsIds')?.value || []" (confirmSelection)="onUsersSelected($event)"
    (closeDialog)="closeUserDialog()">
  </app-user-selection-dialog>

</div>
