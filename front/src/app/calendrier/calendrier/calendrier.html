<div class="art-page-bg p-4 sm:p-8 animate-fadeIn">
  <main class="max-w-[1600px] mx-auto space-y-6">

    <!-- En-tête avec titre et sélecteurs de vue -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 sm:p-6 rounded-3xl border border-slate-200 shadow-xs">
      <div>
        <nav class="flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-1">
          <a routerLink="/home" class="hover:text-slate-900 cursor-pointer transition-colors">Cabinet</a>
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
          <span class="text-slate-900 font-black">Agenda & Audiences</span>
        </nav>
        <h1 class="text-2xl sm:text-3xl art-heading">
          Calendrier <span class="text-[#D97706]">Judiciaire</span>
        </h1>
      </div>

      <!-- Sélecteurs de vue -->
      <div class="flex gap-1.5 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
        <button (click)="selectedView = 'day'" 
          [class]="selectedView === 'day' ? 'bg-slate-900 text-white font-black shadow-md' : 'text-slate-900 hover:bg-white font-bold'"
          class="px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition-all cursor-pointer">
          Vue Jour
        </button>
        <button (click)="selectedView = 'week'" 
          [class]="selectedView === 'week' ? 'bg-slate-900 text-white font-black shadow-md' : 'text-slate-900 hover:bg-white font-bold'"
          class="px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition-all cursor-pointer">
          Vue Semaine
        </button>
      </div>
    </div>

    <!-- Affichage conditionnel des composants -->
    @if (selectedView == 'day') {
      <app-calendrier-jour></app-calendrier-jour>
    }

    @if (selectedView == 'week') {
      <app-calendrier-semaine></app-calendrier-semaine>
    }

  </main>
</div>
