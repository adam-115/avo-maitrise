<div class="p-6 sm:p-8 bg-white rounded-3xl shadow-sm border border-slate-200 animate-fadeIn font-sans text-[#0F172A]">

  <div class="mb-6 flex flex-col xl:flex-row justify-between xl:items-center border-b border-slate-100 pb-4 gap-4">

    <h2 class="text-2xl font-black text-[#0F172A] flex items-center font-heading">
      <div class="p-2.5 bg-[#1E3A8A]/10 text-[#1E3A8A] rounded-2xl border border-[#1E3A8A]/20 mr-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
      </div>
      Agenda du Jour
    </h2>

    <div class="flex flex-wrap gap-3 items-center">
      <button (click)="openAddAppointementDialog()"
        class="btn-gold px-4.5 py-2.5 rounded-xl text-xs font-black shadow-md flex items-center cursor-pointer">
        <svg class="w-4 h-4 mr-1.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
        </svg>
        Ajouter une audience
      </button>

      <button (click)="goToToday()"
        class="px-4 py-2 text-xs font-black rounded-xl text-white bg-[#1E3A8A] hover:bg-[#1E40AF] transition-all shadow-2xs flex items-center cursor-pointer">
        Aujourd'hui
      </button>

      <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-xl border border-slate-200">
        <button (click)="changeDay(-1)"
          class="p-1.5 text-slate-600 hover:text-[#1E3A8A] hover:bg-white rounded-lg transition-all cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>

        <span class="text-xs font-black text-[#0F172A] px-3 whitespace-nowrap">
          {{ date | date:'EEEE dd MMMM yyyy' }}
        </span>

        <button (click)="changeDay(1)"
          class="p-1.5 text-slate-600 hover:text-[#1E3A8A] hover:bg-white rounded-lg transition-all cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="border border-slate-200 rounded-2xl overflow-hidden flex shadow-2xs">

    <div class="flex-shrink-0 w-20 bg-slate-50 border-r border-slate-200">
      <div class="h-14 text-[10px] font-black uppercase tracking-widest text-slate-400 flex items-center justify-center border-b border-slate-200">
        Heures</div>

      <div *ngFor="let hour of hours"
        class="h-16 text-xs text-slate-500 font-bold flex justify-end pr-2.5 items-start pt-1 border-b border-dashed border-slate-200">
        {{ hour }}:00
      </div>
    </div>

    <div (click)="handleGridClick($event)" class="flex-grow bg-white relative h-[704px] cursor-pointer">

      <ng-container *ngFor="let hour of hours">
      </ng-container>

      <div *ngFor="let hearing of dayHearings" (click)="$event.stopPropagation()"
        (click)="openEditAppointementDialog(hearing)"
        class="absolute p-2 rounded-xl border-l-4 shadow-sm cursor-pointer hover:shadow-md transition duration-150 group flex justify-between items-start"
        [ngClass]="getStatusClass(hearing.status)" [style.top]="hearing.style.top" [style.height]="hearing.style.height"
        [style.width]="hearing.style.width" [style.left]="hearing.style.left" [style.zIndex]="hearing.style.zIndex">

        <div class="overflow-hidden">
          <p class="text-[11px] font-black truncate leading-tight">{{ hearing.title }}</p>
          <p class="text-[10px] font-bold mt-0.5 truncate opacity-90">
            <span>Heure :</span> {{ hearing.time }} - {{ hearing.endTime }}
          </p>
          <p class="text-[10px] font-semibold truncate opacity-80 mt-0.5">{{ hearing.clientCase }}</p>
        </div>

        <button (click)="deleteAppointement(hearing, $event)" title="Supprimer"
          class="text-[#EF4444] hover:bg-rose-50 rounded p-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0 ml-1 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
            </path>
          </svg>
        </button>
      </div>

      <div *ngIf="dayHearings.length === 0"
        class="text-center p-8 text-slate-400 font-bold text-xs italic absolute top-1/2 left-0 right-0 transform -translate-y-1/2">
        Aucune audience prévue pour ce jour.
      </div>
    </div>
  </div>

  <div class="mt-5 text-xs text-slate-500 flex items-center gap-3">
    <span class="font-black uppercase text-[10px] tracking-wider text-slate-400">Légende Statut :</span>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-rose-50 text-[#EF4444] border border-rose-200">Urgent</span>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-blue-50 text-[#1E3A8A] border border-blue-200">Standard</span>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-amber-50 text-[#D97706] border border-amber-200">Reporté</span>
  </div>
</div>

<app-appointement-dialog *ngIf="showAppointementDialog" [selectedAppointement]="selectedAppointement"
  [initialDate]="selectedDateStr" [initialTime]="selectedTime" (onClose)="closeAppointementDialog()"
  (onSave)="onAppointementSaved()">
</app-appointement-dialog>
