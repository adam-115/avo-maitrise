<div
  class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 animate-in fade-in duration-200">
  
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-xl overflow-hidden transform transition-all flex flex-col max-h-[90vh]">
    
    <!-- Modal Header -->
    <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-slate-900">
            {{ isEditing ? ('NOTE_DIALOG.EDIT_NOTE' | translate) : ('NOTE_DIALOG.NEW_NOTE' | translate) }}
          </h3>
          <p class="text-xs text-slate-500 font-medium mt-0.5">
            {{ 'NOTE_DIALOG.SUBTITLE' | translate }}
          </p>
        </div>
      </div>

      <button type="button" (click)="onClose()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body / Form -->
    <div class="p-6 overflow-y-auto flex-1 max-h-[65vh]">
      <form [formGroup]="noteForm" id="noteForm" (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Category -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            {{ 'NOTE_DIALOG.CATEGORY_LABEL' | translate }} <span class="text-red-500">*</span>
          </label>
          <select formControlName="categoryId"
            [ngClass]="{
              'border-red-400 ring-2 ring-red-100 bg-red-50/20': noteForm.get('categoryId')?.invalid && noteForm.get('categoryId')?.touched,
              'border-slate-200 hover:border-slate-300 focus:border-indigo-500': !(noteForm.get('categoryId')?.invalid && noteForm.get('categoryId')?.touched)
            }"
            class="block w-full px-3.5 py-2.5 rounded-xl border bg-white text-xs font-bold text-slate-800 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all cursor-pointer">
            <option value="" disabled>{{ 'NOTE_DIALOG.CATEGORY_PLACEHOLDER' | translate }}</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.label }}</option>
          </select>
          <p *ngIf="noteForm.get('categoryId')?.invalid && noteForm.get('categoryId')?.touched" class="text-[11px] font-bold text-red-500 mt-1">
            {{ 'DOSSIER_FORM.REQUIRED' | translate }}
          </p>
        </div>

        <!-- Note Title -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            {{ 'NOTE_DIALOG.TITLE_LABEL' | translate }} <span class="text-red-500">*</span>
          </label>
          <input type="text" formControlName="title"
            [placeholder]="'NOTE_DIALOG.TITLE_PLACEHOLDER' | translate"
            [ngClass]="{
              'border-red-400 ring-2 ring-red-100 bg-red-50/20': noteForm.get('title')?.invalid && noteForm.get('title')?.touched,
              'border-slate-200 hover:border-slate-300 focus:border-indigo-500': !(noteForm.get('title')?.invalid && noteForm.get('title')?.touched)
            }"
            class="block w-full px-3.5 py-2.5 rounded-xl border bg-white text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all">
          <p *ngIf="noteForm.get('title')?.invalid && noteForm.get('title')?.touched" class="text-[11px] font-bold text-red-500 mt-1">
            {{ 'DOSSIER_FORM.REQUIRED' | translate }}
          </p>
        </div>

        <!-- Description / Content -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            {{ 'NOTE_DIALOG.CONTENT_LABEL' | translate }} <span class="text-red-500">*</span>
          </label>
          <textarea formControlName="description" rows="6"
            [placeholder]="'NOTE_DIALOG.CONTENT_PLACEHOLDER' | translate"
            [ngClass]="{
              'border-red-400 ring-2 ring-red-100 bg-red-50/20': noteForm.get('description')?.invalid && noteForm.get('description')?.touched,
              'border-slate-200 hover:border-slate-300 focus:border-indigo-500': !(noteForm.get('description')?.invalid && noteForm.get('description')?.touched)
            }"
            class="block w-full px-3.5 py-2.5 rounded-xl border bg-white text-xs font-medium text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all resize-none leading-relaxed"></textarea>
          <p *ngIf="noteForm.get('description')?.invalid && noteForm.get('description')?.touched" class="text-[11px] font-bold text-red-500 mt-1">
            {{ 'DOSSIER_FORM.REQUIRED' | translate }}
          </p>
        </div>

      </form>
    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-4 bg-slate-50/80 border-t border-slate-100 flex items-center justify-end gap-3 rounded-b-2xl">
      <button type="button" (click)="onClose()"
        class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold transition-all cursor-pointer">
        {{ 'NOTE_DIALOG.CANCEL' | translate }}
      </button>

      <button type="button" (click)="onSubmit()" [disabled]="noteForm.invalid"
        class="inline-flex items-center gap-2 px-5 py-2 rounded-xl text-white text-xs font-bold shadow-sm transition-all cursor-pointer"
        [ngClass]="noteForm.invalid ? 'bg-slate-300 cursor-not-allowed text-slate-500' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-95 shadow-indigo-200'">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        <span>{{ isEditing ? ('NOTE_DIALOG.UPDATE' | translate) : ('NOTE_DIALOG.SAVE' | translate) }}</span>
      </button>
    </div>

  </div>
</div>
