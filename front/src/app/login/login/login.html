<div class="art-page-bg p-4 sm:p-8 animate-fadeIn">

  <div class="hidden lg:flex w-1/2 bg-slate-900 items-center justify-center p-16 relative overflow-hidden">

    <svg class="absolute inset-0 h-full w-full opacity-30" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <pattern id="pattern-diag" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
          <path class="text-cyan-600" d="M-1,1 l2,-2 M0,10 l10,-10 M9,11 l2,-2" stroke-width="1.5"
            stroke="currentColor" />
        </pattern>
      </defs>
      <rect x="0" y="0" width="100%" height="100%" fill="url(#pattern-diag)" />
    </svg>

    <div class="z-10 text-center text-white p-8">
      <div class="mb-6 flex justify-center">
        <img src="/logo-app.jpg" alt="SI Legal" class="w-64 h-auto rounded-xl shadow-2xl border border-slate-700/50 hover:scale-[1.02] transition-transform duration-300">
      </div>
      <p class="text-slate-300 text-xl max-w-sm mx-auto mt-6">
        La plateforme sécurisée pour votre gestion de cas et votre agenda.
      </p>
    </div>
  </div>

  <div class="flex-1 flex items-center justify-center p-6 sm:p-12 lg:p-16 bg-slate-100">

    <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-xl shadow-2xl border-t-4 border-cyan-500">

      <div class="text-left mb-8">
        <h2 class="text-3xl font-extrabold text-slate-800">
          Authentification
        </h2>
        <p class="text-gray-500 mt-2">Accès réservé aux membres du cabinet.</p>
      </div>

      @if (errorMessage) {
      <div class="mb-6 p-4 rounded-lg bg-red-50 border-l-4 border-red-500 text-red-700 flex items-start">
        <svg class="h-5 w-5 mr-3 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-sm font-medium">{{ errorMessage }}</p>
      </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="navigateToHomePage()" class="space-y-6">

        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">
            Adresse Email
          </label>
          <input type="email" id="email" formControlName="email" required placeholder="votre.email@cabinet.com"
            class="w-full px-4 py-2.5 rounded-lg focus:ring-cyan-500 focus:border-cyan-500 shadow-inner text-gray-900 transition duration-150 border-2 border-slate-300 hover:border-slate-400 transition-colors">
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">
            Mot de Passe
          </label>
          <input type="password" id="password" formControlName="password" required placeholder="●●●●●●●●"
            class="w-full px-4 py-2.5 rounded-lg focus:ring-cyan-500 focus:border-cyan-500 shadow-inner text-gray-900 transition duration-150 border-2 border-slate-300 hover:border-slate-400 transition-colors">
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox"
              class="h-4 w-4 text-cyan-600 border-gray-300 rounded focus:ring-cyan-500">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900">
              Rester connecté
            </label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-medium text-cyan-600 hover:text-cyan-700 transition duration-150">
              Mot de passe oublié ?
            </a>
          </div>
        </div>

        <div>
          <button type="submit"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-xl text-lg font-bold text-slate-900 bg-cyan-500 hover:bg-cyan-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 transition duration-200 focus:ring-offset-slate-100">
            Se Connecter
          </button>
        </div>
      </form>

    </div>

    <!-- Modern Subtle Environment Badge -->
    @if (!environment.production) {
      <div class="absolute bottom-4 right-4 flex items-center gap-2 px-3 py-1.5 bg-slate-800/90 text-slate-300 text-xs font-semibold rounded-full shadow-lg border border-slate-700">
        <span class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span>
        <span>Mode Développeur</span>
        <span class="text-slate-500">|</span>
        <span class="text-slate-400 font-mono text-[10px]">{{ environment.apiUrl }}</span>
      </div>
    }

  </div>

</div>
