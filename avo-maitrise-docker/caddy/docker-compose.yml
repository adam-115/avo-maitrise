services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared-network

volumes:
  # Ces volumes sont cruciaux pour sauvegarder les certificats SSL générés par Let's Encrypt
  caddy_data:
  caddy_config:

networks:
  shared-network:
    external: true
    name: ${NETWORK_NAME:-shared-network}
