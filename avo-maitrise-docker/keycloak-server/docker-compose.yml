services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal          # Réseau interne uniquement (pas d'accès Internet)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    command: start          # Mode production (build optimisé au démarrage)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Base de données ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: 25
      KC_DB_POOL_MIN_SIZE: 25
      KC_DB_POOL_MAX_SIZE: 25

      # --- Hostname & Proxy (TLS terminé par Caddy) ---
      KC_HOSTNAME: ${KC_HOSTNAME}               # https://si-legal-auth.duckdns.org
      KC_HTTP_ENABLED: "true"                   # HTTP autorisé à l'intérieur du réseau Docker
      KC_PROXY_HEADERS: xforwarded              # Fait confiance aux en-têtes X-Forwarded-* de Caddy
      KC_HOSTNAME_STRICT: "true"                # Verrouille Keycloak sur le hostname public

      # --- Admin bootstrap (premier démarrage uniquement) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # --- Observabilité ---
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
      KC_LOG_CONSOLE_OUTPUT: json               # Logs structurés pour agrégation

      # --- Cache (nœud unique) ---
      KC_CACHE: local

    networks:
      - internal
      - proxy            # Réseau partagé avec Caddy
    # ⚠️ AUCUN port exposé publiquement : seul Caddy peut y accéder
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"          # Nécessaire pour le challenge ACME (Let's Encrypt)
      - "443:443"        # HTTPS public
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}               # si-legal-auth.duckdns.org
      - LE_EMAIL=${LE_EMAIL}                     # Email pour Let's Encrypt
    networks:
      - proxy            # Réseau partagé avec Keycloak
    depends_on:
      - keycloak

  backup:
    image: postgres:16-alpine
    container_name: keycloak-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /home/adam/backup:/backups
    entrypoint: |
      sh -c '
        mkdir -p /backups
        while true; do
          echo "[$(date)] Début de la sauvegarde..."
          pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" --format=custom \
            | gzip > "/backups/keycloak-backup-$$(date +%Y%m%d-%H%M%S).dump.gz"
          echo "[$(date)] Sauvegarde terminée."
          find /backups -name "keycloak-backup-*.dump.gz" -mtime +7 -delete
          echo "[$(date)] Prochaine sauvegarde dans 24h."
          sleep 86400
        done
      '
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
    internal: true          # Isolation totale : pas d'accès Internet sortant
  proxy:
    driver: bridge          # Réseau pour Caddy <-> Keycloak