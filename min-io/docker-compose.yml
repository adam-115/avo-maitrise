services:
  minio:
    image: chrislusf/seaweedfs:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:8333"   # Port S3 compatible (utilisez localhost:9000 dans vos apps)
      - "9333:9333"   # Interface / Master port de SeaweedFS
      - "8888:8888"   # Filer UI (Interface graphique pour voir les fichiers)
    environment:
      - MINIO_ROOT_USER=adam
      - MINIO_ROOT_PASSWORD=adam
    command: "server -dir=/data -s3 -filer"
    volumes:
      - D:/min-io-data:/data

  # Service de sauvegarde automatique
  minio-backup:
    image: acouvreur/minio-backup-local:latest
    container_name: minio-backup
    restart: always
    depends_on:
      - minio
    volumes:
      - D:/min-io-data:/minio_data:ro
      - D:/mion-io-data-sauvegarde:/backups
    environment:
      MINIO_DIR: /minio_data
      MINIO_BUCKET: "mes-documents"
      SCHEDULE: "@daily"
      TZ: "Europe/Paris"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6