services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: avo-back-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/si-legale?serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=adam
      - YENTE_API_URL=http://host.docker.internal:8000
      - MINIO_URL=http://host.docker.internal:9000
      - QDRANT_HOST=host.docker.internal
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_LIQUIBASE_ENABLED=true
      - KEYCLOAK_ISSUER_URI=https://keycloak-si-legal.duckdns.org/auth/realms/avo-app-test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    restart: always
    networks:
      - shared-network

  mysql:
    image: mysql:8.0
    container_name: avo-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=si-legale
      - MYSQL_ROOT_PASSWORD=adam
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    networks:
      - shared-network

  # ---- CONTENEUR DE SAUVEGARDE ----
  db-backup:
    image: fradelg/mysql-cron-backup
    container_name: avo-mysql-backup-test
    restart: always
    depends_on:
      - mysql
    networks:
      - shared-network
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASS=adam
      - MYSQL_DATABASE=si-legale
      # Planification : tous les jours Ã  23:00
      - CRON_TIME=0 23 * * *
      # CrÃ©e un backup immÃ©diat au lancement du conteneur
      - INIT_BACKUP=1 
      # Conserver uniquement les 50 derniÃ¨res sauvegardes
      - MAX_BACKUPS=50
    volumes:
      # Montage vers ton dossier cible sur le serveur Linux
      - /home/adam/sauvegardeDb:/backup

volumes:
  mysql-data:

networks:
  shared-network:
    external: true
    name: shared-network