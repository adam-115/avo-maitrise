# ===================================================================
# PRODUCTION PROFILE
# ===================================================================

# --- Server & Proxy ---
# Strategy for Reverse Proxy (Caddy)
server.forward-headers-strategy=framework

# --- Database Overrides (Environment Variables) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/si-legale?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adam}

# --- Security & Keycloak Overrides (Environment Variables) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:7070/realms/avo-app-test}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:7070/realms/avo-app-test}

keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:7070}

# --- Yente API Overrides (Environment Variables) ---
yente.api.url=${YENTE_API_URL:http://localhost:8000}

# --- Logging ---
logging.file.name=application.log