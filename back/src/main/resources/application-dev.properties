# ===================================================================
# Development Configuration Profile ('dev')
# ===================================================================

# Exclude OAuth2 Resource Server, Client, and Liquibase auto-configurations
# This allows the app to start and run without a live Keycloak server or database connection.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Logging configuration for local development
logging.level.org.springframework.security=INFO
logging.level.com.avo=DEBUG

# Disable database startup requirements for local development
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.liquibase.enabled=true
