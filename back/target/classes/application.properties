# ===================================================================
# BASE CONFIGURATION (Shared across all profiles)
# ===================================================================

# --- Spring Profile ---
spring.profiles.active=staging

# --- Static Resources & DevTools ---
spring.devtools.restart.additional-paths=file:d:/avo-maitrise/front/src
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:d:/avo-maitrise/front/dist/front/browser/

# --- Database & JPA Defaults ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/si-legale?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adam}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# --- Security & Keycloak Defaults ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:7070/realms/avo-app-test}
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:avo-test-client}

keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:7070}
keycloak.realm=${KEYCLOAK_REALM:avo-app-test}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:avo-admin-client}
keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:WOj6uy5Q5EMI3rO6WWZFERgukq9mz6pm}

# --- Yente API Defaults ---
yente.api.url=${YENTE_API_URL:http://localhost:8000}
yente.api.default.dataset=${YENTE_DATASET:default}
yente.api.default.match.path=${YENTE_MATCH_PATH:/match/}
yente.api.key=${YENTE_API_KEY:adam}
aml.block.threshold=0.60
aml.suspect.threshold=0.50
aml.match.batch.size=100


# --- Logging Defaults ---
logging.file.name=avo-application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n



# Configuration SMTP Brevo
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:b00140001@smtp-brevo.com}
# spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${SPRING_MAIL_FROM:adamlaftimi@gmail.com}

# Optionnel : Définir des timeouts pour éviter les blocages
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# ACTUATOR MONITORING & SECURITY
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN,SUPER_ADMIN,admin,super_admin
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never

# --- Security: Disable Stack Trace Leaks in default Spring MVC Error Handling ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never


