# Default profile
spring.profiles.active=prod

# logging.file.name=avo-application.log
# name= "adam"

spring.liquibase.enabled=true

spring.devtools.restart.additional-paths=file:d:/avo-maitrise/front/src
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:d:/avo-maitrise/front/dist/front/browser/

# Database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/si-legale?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=adam
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Yente Configuration
yente.api.url=http://localhost:8000
yente.api.default.dataset=tous_les_datasets?expand=true
yente.api.default.match.path=/match/
yente.api.key=adam
aml.block.threshold=0.60
aml.suspect.threshold=0.50
aml.match.batch.size=100

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:7070/realms/avo-app-test


# --- Spring Boot Admin & Actuator Configuration ---
# SBA Server location
spring.boot.admin.client.url=http://localhost:8085

# Expose Actuator endpoints (secured via HTTP Basic Auth)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


# Optional: Log file path and pattern configuration for SBA UI log viewing
logging.file.name=avo-application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


